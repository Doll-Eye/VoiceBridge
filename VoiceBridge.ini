; VoiceBridge reads this file next to VoiceBridge.exe.
; Restart the supervisor to apply changes.

[voice]
; Match part of a SAPI voice description. Empty fallback allows any voice.
name=Jenny
fallback=
; Rate is -10 to 10, and volume is 0 to 100.
rate=0
volume=100
; Use Narrator's voice and rate where its settings are readable.
followNarrator=1

[audio]
; Release the audio stream after this many idle seconds.
keepAwakeSeconds=30

[cache]
; In-memory phrase cache in megabytes. Zero disables the cache.
megabytes=64

[log]
; Error, info or debug. To record spoken text during tests, use debug and text=1.
level=info
text=0

[nvda]
; Same-session executable names, separated by semicolons.
processNames=nvda.exe;nvda_uiAccess.exe;nvda_noUIAccess.exe
